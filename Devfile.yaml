commands:
    - name: build
      description: Build the library
      run: go build ./...
      syncAfter: false
    - name: run
      description: Run the tests (this is a library — there is no main package)
      run: go test ./...
      syncAfter: false
    - name: test
      description: Run tests
      run: go test ./...
      syncAfter: false
    - name: fmt
      description: Format code
      run: gofmt -w -s .
      syncAfter: false
    - name: vet
      description: Run go vet
      run: go vet ./...
      syncAfter: false
    - name: check
      description: Run all checks
      run: gofmt -w -s . && go vet ./... && go test ./...
      syncAfter: false
    - name: tidy
      description: Tidy dependencies
      run: go mod tidy
      syncAfter: false
